- name: Modules
  path: module
  childs:
    - name: AtlassianPS.Configuration
      path: module/AtlassianPS.Configuration
    - name: ConfluencePS
      path: module/ConfluencePS
    - name: JiraAgilePS
      path: module/JiraAgilePS
    - name: JiraPS
      path: module/JiraPS
- name: Documentation
  path: docs
  childs:
    - name: Quick Start
      path: docs/quick-start.html
    - name: Contributing
      path: docs/Contributing
      listChilds: true
    - name: Gallery
      path: docs/Gallery
      listChilds: true
    - name: AtlassianPS.Configuration
      path: docs/AtlassianPS.Configuration
      groups:
        - About
        - Commands
        - Classes
        - Enumerations
    - name: ConfluencePS
      path: docs/ConfluencePS
      groups:
        - Commands
        - Classes
    - name: JiraAgilePS
      path: docs/JiraAgilePS
      groups:
        - About
        - Commands
    - name: JiraPS
      path: docs/JiraPS
      groups:
        - About
        - Commands
- name: Donate
  path: donate
- name: Contact
  path: contact
