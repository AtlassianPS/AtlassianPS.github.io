name: Docs hygiene

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "_data/**"
      - "assets/**"
      - "_layouts/**"
      - "_includes/**"
      - ".lycheeignore"
      - ".github/workflows/docs-hygiene.yml"
  pull_request:
    branches: [master]
    paths:
      - "docs/**"
      - "_data/**"
      - "assets/**"
      - "_layouts/**"
      - "_includes/**"
      - ".lycheeignore"
      - ".github/workflows/docs-hygiene.yml"

permissions:
  contents: read

jobs:
  local-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production

      - name: Check local docs links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir _site '_site/docs/Contributing/**/*.html' '_site/docs/Gallery/**/*.html'
          fail: true
