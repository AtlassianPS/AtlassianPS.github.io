name: Docs build

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: &docs_build_paths
      - "docs/**"
      - "_data/**"
      - "assets/**"
      - "_layouts/**"
      - "_includes/**"
      - ".github/workflows/docs-hygiene.yml"
  pull_request:
    branches: [master]
    paths: *docs_build_paths

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build --baseurl ""
        env:
          JEKYLL_ENV: production
